[pytest]
; Run from the backend/ directory (see scripts/run_tests.sh). Without this
; inifile pytest resolves rootdir to the repo root, whose testpaths target a
; non-existent top-level tests/ dir, and then collects scratch scripts such as
; backend/test_upload.py (a manual live-server check) — breaking the suite.
asyncio_mode = auto
testpaths = tests
