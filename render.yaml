# Render Blueprint — BACKEND (FastAPI) only.
# The frontend (frontend/dist) deploys separately as a Static Site.
#
# NO SECRET VALUES here. Secrets are set in the Render dashboard:
#   - SECRET_KEY   -> generated by Render (generateValue: true), stays stable
#   - DATABASE_URL -> paste the Neon connection string  (sync: false)
#   - CORS_ORIGINS -> the deployed Static Site URL      (sync: false)
#   - OCRSPACE_API_KEY (optional) -> leave unset for fully-offline OCR
#
# After first deploy, run the one-time admin seed from the service Shell:
#   python create_test_users.py    (then change admin@faculty.edu's password)

services:
  - type: web
    name: faculty-portal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # free = spins down after 15 min idle, no persistent disk.
                          # Use "starter" for always-on + a mountable disk.
    region: singapore     # pick the region closest to the Neon DB region
    healthCheckPath: /healthz
    autoDeploy: false     # deploy manually / on demand
    # Runs once per deploy, before traffic is switched to the new instance:
    preDeployCommand: "alembic -c /app/alembic.ini upgrade head"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none          # frontend is on a different domain than the API
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOCAL_STORAGE_ROOT
        value: /data/storage # Ephemeral container cache. With STORAGE_BACKEND=gdrive, uploads are durable in Drive.
      - key: STORAGE_BACKEND
        value: local         # Set to "gdrive" in dashboard to enable Google Drive zero-cost persistent storage
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false          # set in dashboard: Google Drive private folder ID
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false          # set in dashboard: Google Cloud OAuth 2.0 Client ID
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false          # set in dashboard: Google Cloud OAuth 2.0 Client Secret
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false          # set in dashboard: OAuth 2.0 refresh token from scripts/setup_google_drive.py
      - key: S3_ENDPOINT_URL
        sync: false          # (optional alternative) https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false          # (optional alternative)
      - key: S3_SECRET_ACCESS_KEY
        sync: false          # (optional alternative)
      - key: S3_BUCKET_NAME
        sync: false          # (optional alternative) e.g. faculty-patents
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: SECRET_KEY
        generateValue: true  # Render creates a strong random value once and keeps it.
      - key: DATABASE_URL
        sync: false          # set in dashboard: postgresql+asyncpg://…neon.tech/neondb?sslmode=require
      - key: CORS_ORIGINS
        sync: false          # set in dashboard: https://<your-static-site>.onrender.com
      - key: OCRSPACE_API_KEY
        sync: false          # optional; leave blank to run OCR fully offline
