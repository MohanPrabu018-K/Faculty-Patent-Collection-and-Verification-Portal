[project]
name = "faculty-patent-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "opencv-python-headless>=4.9",
    "pyzbar>=0.1.9",
    "pytesseract>=0.3.13",      # local OCR (needs the tesseract-ocr binary on PATH or TESSERACT_CMD)
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "bandit>=1.7",
    "safety>=3.0",
    "pip-audit>=2.7",
    "mypy>=1.9",
    "ruff>=0.3",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5"]
llm = ["ollama>=0.1"]               # optional local LLM
paddle = ["paddleocr>=2.7"]         # optional alternative OCR
embeddings = ["sentence-transformers>=2.6"]  # optional similarity embeddings

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow asserts in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true